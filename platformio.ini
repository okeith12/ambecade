; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; The ST7789 driver, gfx layer, screen interface and button input come from the
; shared percyus_displays package, not Adafruit. Display/ holds only this
; project's own screens and assets.
lib_deps = https://github.com/okeith12/percyus_displays.git
build_unflags = -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -IDisplay/gfx
    -IDisplay/screen
build_src_filter =
    +<*>
    +<../Display/screen/procedural_face.cpp>
    +<../Display/screen/shapes_screen.cpp>
    +<../Display/screen/bitmap_face.cpp>
    +<../Display/screen/galaga.cpp>
    +<../Display/screen/galaga_screen.cpp>
    +<../Display/screen/firefly_catch.cpp>
    +<../Display/screen/firefly_catch_screen.cpp>
    +<../Display/screen/clock_screen.cpp>
    +<../Display/screen/anniversary_screen.cpp>
